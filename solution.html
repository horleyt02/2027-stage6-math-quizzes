<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Solution</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #f8fafc; }
        header { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 15px; text-align: center; font-weight: bold; }
        iframe { width: 100%; height: calc(100% - 54px); border: none; }
        .error { padding: 40px; color: #dc2626; text-align: center; font-family: sans-serif; }
    </style>
</head>
<body>

    <header id="solution-title">Loading Solution...</header>
    <iframe id="solution-frame" src=""></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const term = params.get('term');
        const course = params.get('course');
        const quiz = params.get('quiz');
        const question = params.get('q');

        const titleElement = document.getElementById('solution-title');
        const frameElement = document.getElementById('solution-frame');

        if (term && course && quiz && question) {
            titleElement.innerText = `${term.toUpperCase()} | ${course.toUpperCase()} | ${quiz.toUpperCase()} | Q${question}`;
            frameElement.src = `solutions/${term}/${course}/${quiz}/q${question}.html`;
        } else {
            titleElement.innerText = "Solution Not Found";
            frameElement.outerHTML = "<div class='error'>Invalid URL parameters. Please use the exact link from your Google Form feedback.</div>";
        }
    </script>

</body>
</html>
